appId: com.mipyip.cc-command-center
productName: CC Command Center
copyright: © 2026 MipYip, LLC

directories:
  output: release
  buildResources: build

# Auto-update feed. Releases (the DMG/ZIP + latest-mac.yml the updater reads)
# live in a SEPARATE PUBLIC repo, so the app needs no embedded token and the
# source repo's Releases tab stays free of 130MB binaries. This block's only
# job here is to be embedded as app-update.yml, which electron-updater reads at
# runtime to find the feed — the actual upload is done by scripts/publish.mjs
# via gh, not electron-builder's own publisher (which raced on parallel uploads).
publish:
  provider: github
  owner: avanrossum
  # Releases live in the main repo from v0.24.0 on. Builds BEFORE this still point at
  # claude-command-center-releases, so that repo has to keep receiving releases until
  # everyone has moved past them — see docs/backlog.md.
  repo: cc-command-center

# Space-free artifact names. The default uses productName ("CC Command Center"),
# whose spaces GitHub rewrites to dots on upload — which then don't match the
# hyphen-safe URLs electron-builder writes into latest-mac.yml, breaking the
# updater. A hyphenated name keeps the file, the yml URL, and the uploaded asset
# identical. ${name} is the package.json name (cc-command-center).
artifactName: ${name}-${version}-${arch}.${ext}

# electron-vite emits the bundled app to out/; native deps (better-sqlite3,
# node-pty) stay external and are pulled from node_modules by electron-builder.
files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/icon.png
    to: icon.png
  # The on-device speech helper (see native/ccc-speech). Built by
  # scripts/build-speech.mjs before packaging; @electron/osx-sign walks Contents/
  # and signs it with the rest of the bundle, so it needs no separate step.
  # Optional: if the build machine has no Swift toolchain the file is absent and
  # the Apple engine reports itself unavailable at runtime.
  - from: native/ccc-speech/ccc-speech
    to: ccc-speech
    # Do not fail packaging when the helper was not built.
    filter: ["**/*"]

# Native .node addons must live outside the asar so they can be dlopen'd.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/node-pty/**"

mac:
  category: public.app-category.developer-tools
  # Apple Silicon only — deliberate. Every shipped build has been arm64 (it was
  # inheriting the host arch); pinning it makes that explicit and keeps the
  # README honest. No Intel/Windows/Linux target planned.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: resources/icon.icns
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarize via APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (env).
  notarize: true
  extendInfo:
    # Electron ships a generic default ("This app needs access to the microphone"),
    # which is what the user reads in the consent dialog. Say what it is actually for.
    NSMicrophoneUsageDescription: >-
      CC Command Center uses the microphone only while you hold the dictation
      button, to turn speech into text for the session you are typing into.
      Audio is transcribed on this Mac and is never uploaded.
    # Required if anything touches the Speech framework. A MISSING usage string does
    # not fail quietly — TCC terminates the process
    # (__TCC_CRASHING_DUE_TO_PRIVACY_VIOLATION__), and only in packaged builds.
    NSSpeechRecognitionUsageDescription: >-
      Speech recognition runs on this Mac to convert your dictation into text.

dmg:
  title: ${productName}
  iconSize: 80
  window:
    width: 540
    height: 380
